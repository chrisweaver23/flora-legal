<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flora — Gut Health Tracker</title>
<meta name="description" content="Flora scores every meal for your gut, learns your triggers, and helps you eat like it matters.">
<style>
  :root { --ink:#17251D; --ink2:#3C4A42; --ink3:#7A867F; --green:#0A7A46; --bg:#F7FAF7; --card:#FFFFFF; --line:#E4EAE5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:44px 40px; max-width:430px; text-align:center; margin:24px; }
  .leaf { width:56px; height:56px; border-radius:28px; background:var(--green); display:flex; align-items:center; justify-content:center; color:#fff; font-size:27px; margin:0 auto 16px; }
  h1 { font-family:Georgia, "Times New Roman", serif; font-size:34px; margin:0 0 8px; }
  p { color:var(--ink2); margin:0 0 24px; }
  .links a { display:inline-block; margin:0 8px; color:var(--green); font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="leaf">🌿</div>
    <h1>Flora</h1>
    <p>The gut-health tracker. Every meal scored for your gut — it learns your triggers and personalizes everything.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
